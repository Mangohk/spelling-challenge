<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拼字勇者 · Version Two</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0f2a24;
      --muted: #4d6b62;
      --panel: #fffdf7;
      --leaf: #1f9d6c;
      --leaf-dark: #147a52;
      --sky: #2f9fbf;
      --sun: #f0b429;
      --coral: #e85d4c;
      --mist: #d8f3e7;
      --shadow: 0 10px 28px rgba(15, 42, 36, 0.12);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Nunito', system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 18%, rgba(240, 180, 41, 0.28), transparent 32%),
        radial-gradient(circle at 88% 10%, rgba(47, 159, 191, 0.22), transparent 30%),
        linear-gradient(160deg, #e8faf2 0%, #f7fbff 45%, #fff6e8 100%);
      padding: clamp(0.7rem, 2.5vw, 1.4rem);
    }
    .wrap { max-width: 760px; margin: 0 auto; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.9rem;
    }
    .brand { display: flex; align-items: center; gap: 0.85rem; }
    .logo {
      width: 3.1rem;
      height: 3.1rem;
      border-radius: 1rem;
      display: grid;
      place-items: center;
      font-size: 1.55rem;
      background: linear-gradient(145deg, #39c989, #1f9d6c);
      color: #fff;
      box-shadow: 0 6px 0 #147a52;
      animation: bob 2.4s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    h1 {
      margin: 0;
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: clamp(1.3rem, 4vw, 1.8rem);
      letter-spacing: 0.02em;
    }
    .sub {
      margin: 0.15rem 0 0;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
    }
    .screen {
      display: none;
      background: var(--panel);
      border: 3px solid rgba(31, 157, 108, 0.18);
      border-radius: 1.5rem;
      box-shadow: var(--shadow);
      padding: clamp(1rem, 3vw, 1.5rem);
      animation: rise 0.35s ease;
      overflow: hidden;
    }
    .screen.active { display: block; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero-scene {
      position: relative;
      border-radius: 1.2rem;
      overflow: hidden;
      min-height: clamp(200px, 42vw, 280px);
      background: #c8e9f5 center/cover no-repeat;
      margin-bottom: 1rem;
    }
    .hero-scene::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(15, 42, 36, 0.05), rgba(15, 42, 36, 0.35));
      pointer-events: none;
    }
    .scene-copy {
      position: absolute;
      left: 1rem;
      right: 1rem;
      bottom: 1rem;
      z-index: 2;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }
    .scene-copy h2 {
      margin: 0 0 0.35rem;
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: clamp(1.5rem, 5vw, 2.1rem);
    }
    .scene-copy p {
      margin: 0;
      font-weight: 700;
      font-size: 0.98rem;
      max-width: 28rem;
    }
    .title-hero {
      position: absolute;
      left: 8%;
      bottom: 18%;
      width: clamp(96px, 22vw, 140px);
      z-index: 1;
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.25));
      animation: bob 2.2s ease-in-out infinite;
    }

    .section-title {
      margin: 0 0 0.35rem;
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 1.25rem;
    }
    .hint {
      margin: 0 0 1rem;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }
    .btn {
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: 800;
      padding: 0.75rem 1.25rem;
      border-radius: 999px;
      font-size: 1rem;
      color: #fff;
      background: linear-gradient(145deg, #39c989, var(--leaf));
      box-shadow: 0 5px 0 var(--leaf-dark);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--leaf-dark);
    }
    .btn.secondary {
      background: linear-gradient(145deg, #4db8d4, var(--sky));
      box-shadow: 0 5px 0 #1f7f99;
    }
    .btn.ghost {
      background: transparent;
      color: var(--muted);
      box-shadow: none;
      border: 2px solid #cfe8dc;
    }
    .btn.ghost:active { transform: translateY(1px); }
    .btn.sun {
      background: linear-gradient(145deg, #ffd45a, var(--sun));
      box-shadow: 0 5px 0 #c48c12;
      color: #5c4300;
    }
    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      align-items: center;
    }
    .actions.center { justify-content: center; }
    .tts-control {
      width: 100%;
      max-width: 420px;
      margin: 0 auto 0.85rem;
      padding: 0.7rem 0.9rem;
      border-radius: 1rem;
      background: #eef9f3;
      border: 2px solid #cfe8dc;
    }
    .tts-control label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.75rem;
      font-weight: 800;
      font-size: 0.9rem;
      color: var(--leaf-dark);
      margin-bottom: 0.35rem;
    }
    .tts-control output {
      color: #1a6f86;
      font-variant-numeric: tabular-nums;
    }
    .tts-control input[type="range"] {
      width: 100%;
      accent-color: var(--sky);
      cursor: pointer;
    }
    .tts-ends {
      display: flex;
      justify-content: space-between;
      margin-top: 0.15rem;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      margin-bottom: 0.85rem;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      background: #eef9f3;
      color: var(--leaf-dark);
      font-size: 0.86rem;
      font-weight: 800;
    }
    .pill.sky { background: #e7f6fb; color: #1a6f86; }
    .pill.sun { background: #fff4d6; color: #8a6508; }
    .pill.coral { background: #ffe8e4; color: #a3382a; }
    .progress {
      height: 0.7rem;
      border-radius: 999px;
      background: #e7f2ec;
      overflow: hidden;
      margin-bottom: 1rem;
    }
    .progress > span {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--leaf), var(--sky));
      transition: width 0.35s ease;
    }

    .arena {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    @media (max-width: 560px) {
      .arena { grid-template-columns: 1fr; }
    }
    .fighter {
      border: 3px solid #d7ebe1;
      border-radius: 1.1rem;
      padding: 0.75rem;
      background: #f7fffb;
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .fighter.hit { animation: shake 0.4s ease; }
    .fighter.attack { animation: pop 0.35s ease; }
    .fighter.boss {
      border-color: #e0c6f5;
      background: linear-gradient(180deg, #fbf5ff, #fff);
    }
    .fighter img {
      width: clamp(88px, 22vw, 120px);
      height: clamp(88px, 22vw, 120px);
      object-fit: contain;
      filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.12));
    }
    .fighter h3 {
      margin: 0.25rem 0 0.15rem;
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 1.05rem;
    }
    .fighter .tag {
      margin: 0 0 0.45rem;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 700;
    }
    .hp-row {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--muted);
    }
    .hp-bar {
      flex: 1;
      height: 0.75rem;
      border-radius: 999px;
      background: #e8efe9;
      overflow: hidden;
    }
    .hp-bar > i {
      display: block;
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #39c989, #1f9d6c);
      transition: width 0.35s ease;
    }
    .fighter.boss .hp-bar > i,
    .hp-bar.enemy > i {
      background: linear-gradient(90deg, #ff8a75, var(--coral));
    }

    .meaning {
      text-align: center;
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: clamp(1.35rem, 4vw, 1.8rem);
      margin: 0 0 0.75rem;
    }
    .meaning small {
      display: block;
      margin-top: 0.25rem;
      font-family: 'Nunito', system-ui, sans-serif;
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 700;
    }
    .slots {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.45rem;
      min-height: 5.8rem;
      margin-bottom: 0.75rem;
    }
    .slot-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.4rem;
    }
    .slot {
      width: 3.6rem;
      height: 4.4rem;
      border-radius: 0.9rem;
      border: 3px solid #cfe8dc;
      background: #fff;
      display: grid;
      place-items: center;
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--ink);
      box-shadow: 0 4px 0 #d7ebe1;
    }
    .slot.given {
      background: #eef9f3;
      color: var(--leaf-dark);
      border-color: #b9dfcd;
    }
    .slot.space {
      width: 1.4rem;
      border: none;
      background: transparent;
      box-shadow: none;
    }
    .slot.active {
      border-color: var(--sky);
      box-shadow: 0 0 0 4px rgba(47, 159, 191, 0.18), 0 4px 0 #b7dce8;
    }
    .slot.filled { background: #fff9e8; border-color: #efd27a; }
    .slot.correct {
      background: #e5f9ef;
      border-color: var(--leaf);
      animation: pop 0.35s ease;
    }
    .slot.wrong {
      background: #ffe8e4;
      border-color: var(--coral);
      animation: shake 0.4s ease;
    }
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    .feedback {
      min-height: 1.4rem;
      text-align: center;
      font-weight: 800;
      margin: 0 0 0.85rem;
      color: var(--muted);
    }
    .feedback.ok { color: var(--leaf-dark); }
    .feedback.bad { color: #b53b2d; }

    .keyboard-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 0.45rem;
    }
    .keyboard {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 0.9rem;
    }
    .key-row {
      display: grid;
      gap: 0.35rem;
    }
    .key-row.row-10 { grid-template-columns: repeat(10, minmax(0, 1fr)); }
    .key-row.row-9 { grid-template-columns: repeat(9, minmax(0, 1fr)); }
    .key-row.row-8 { grid-template-columns: repeat(8, minmax(0, 1fr)); }
    .keyboard.layout-qwerty .key-row.row-9 {
      max-width: 92%;
      margin: 0 auto;
      width: 100%;
    }
    .keyboard.layout-qwerty .key-row.row-8 {
      max-width: 84%;
      margin: 0 auto;
      width: 100%;
    }
    @media (max-width: 560px) {
      .key { min-height: 2.7rem; font-size: 1rem; }
    }
    .key {
      border: none;
      cursor: pointer;
      min-height: 3.1rem;
      border-radius: 0.8rem;
      background: #eef9f3;
      color: var(--ink);
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      box-shadow: 0 4px 0 #c5e4d5;
      text-transform: uppercase;
    }
    .key:active { transform: translateY(2px); box-shadow: 0 2px 0 #c5e4d5; }
    .key.wide { font-size: 0.95rem; text-transform: none; }

    .travel-scene {
      position: relative;
      border-radius: 1.2rem;
      overflow: hidden;
      min-height: 240px;
      background: #c8e9f5 center/cover no-repeat;
      margin-bottom: 1rem;
    }
    .walker {
      position: absolute;
      bottom: 18%;
      left: 8%;
      width: clamp(90px, 24vw, 130px);
      filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.2));
      animation: walkAcross 1.8s ease-in-out forwards;
    }
    @keyframes walkAcross {
      0% { left: 6%; transform: translateY(0); }
      25% { transform: translateY(-8px); }
      50% { left: 40%; transform: translateY(0); }
      75% { transform: translateY(-8px); }
      100% { left: 72%; transform: translateY(0); }
    }
    .travel-caption {
      text-align: center;
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 1.35rem;
      margin: 0 0 0.4rem;
    }

    .loot-card {
      text-align: center;
      padding: 0.5rem 0 0.25rem;
    }
    .loot-art {
      width: min(220px, 70vw);
      margin: 0 auto 0.75rem;
      border-radius: 1.1rem;
      border: 3px solid #efe0a8;
      background: #fff9e8;
      padding: 0.6rem;
      box-shadow: 0 8px 0 #e6d28a;
      animation: pop 0.45s ease;
    }
    .loot-art img {
      width: 100%;
      display: block;
      border-radius: 0.7rem;
    }
    .loot-name {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 1.5rem;
      margin: 0 0 0.35rem;
    }
    .loot-effect {
      color: var(--muted);
      font-weight: 700;
      margin: 0 0 1rem;
    }
    .equip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      justify-content: center;
      margin: 0 0 1rem;
    }
    .equip-chip {
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      background: #fff4d6;
      color: #8a6508;
      font-size: 0.82rem;
      font-weight: 800;
    }

    .result-score {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: clamp(2rem, 8vw, 2.8rem);
      text-align: center;
      margin: 0.4rem 0;
    }
    .result-message {
      text-align: center;
      color: var(--muted);
      font-weight: 800;
      margin: 0 0 1rem;
    }
    .result-list {
      list-style: none;
      margin: 0 0 1.1rem;
      padding: 0;
      display: grid;
      gap: 0.45rem;
    }
    .result-list li {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.65rem 0.8rem;
      border-radius: 0.9rem;
      background: #eef9f3;
      font-weight: 800;
      font-size: 0.92rem;
    }
    .result-list li.miss { background: #ffe8e4; }
    .result-hero {
      display: block;
      width: 120px;
      margin: 0 auto 0.75rem;
      filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.15));
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">⚔</div>
        <div>
          <h1>拼字勇者</h1>
          <p class="sub">Version Two · 一直線冒險</p>
        </div>
      </div>
    </header>

    <section id="title" class="screen active">
      <div class="hero-scene" id="title-scene">
        <img class="title-hero" src="assets/hero.png" alt="勇者">
        <div class="scene-copy">
          <h2>拼字勇者</h2>
          <p>向前走、遇二十隻怪物、用拼字攻擊！打贏可以攞裝備，中間同最後有 Boss。</p>
        </div>
      </div>
      <p class="hint">每次攻擊會抽出唔同生字嚟串。串啱扣怪物 HP，串錯扣勇者 HP。</p>
      <div class="actions center">
        <button type="button" class="btn" id="start-btn">開始冒險</button>
      </div>
    </section>

    <section id="travel" class="screen">
      <p class="travel-caption" id="travel-caption">勇者向前行…</p>
      <div class="travel-scene" id="travel-scene">
        <img class="walker" id="walker" src="assets/hero.png" alt="勇者向前行">
      </div>
      <p class="hint" id="travel-hint" style="text-align:center;margin-bottom:0;">前面好像有怪物…</p>
    </section>

    <section id="battle" class="screen">
      <div class="meta-bar">
        <span class="pill" id="progress-pill">1 / 20</span>
        <span class="pill sky" id="atk-pill">攻擊 1</span>
        <span class="pill sky" id="def-pill">防禦 0</span>
        <span class="pill sun" id="buff-pill">無特殊效果</span>
      </div>
      <div class="progress"><span id="progress-fill"></span></div>

      <div class="arena">
        <div class="fighter" id="hero-panel">
          <img src="assets/hero.png" alt="勇者">
          <h3>勇者</h3>
          <p class="tag" id="hero-gear-tag">未裝備</p>
          <div class="hp-row">
            <span>HP</span>
            <div class="hp-bar"><i id="hero-hp-fill"></i></div>
            <span id="hero-hp-text">10/10</span>
          </div>
        </div>
        <div class="fighter" id="monster-panel">
          <img id="monster-img" src="assets/monster.png" alt="生字怪物">
          <h3 id="monster-name">生字怪物</h3>
          <p class="tag" id="monster-tag">普通怪</p>
          <div class="hp-row">
            <span>HP</span>
            <div class="hp-bar enemy"><i id="monster-hp-fill"></i></div>
            <span id="monster-hp-text">2/2</span>
          </div>
        </div>
      </div>

      <p class="meaning" id="word-meaning">美術室<small>聽英文，填晒空白格再攻擊</small></p>
      <div class="slots" id="slots" aria-live="polite"></div>
      <p class="feedback" id="feedback"></p>
      <div class="keyboard-bar">
        <button type="button" class="btn ghost" id="layout-btn">鍵盤：A–Z</button>
      </div>
      <div class="keyboard layout-alpha" id="keyboard"></div>
      <div class="tts-control">
        <label for="tts-rate">
          <span>朗讀速度</span>
          <output id="tts-rate-value" for="tts-rate">0.63×</output>
        </label>
        <input type="range" id="tts-rate" min="0.40" max="1.20" step="0.01" value="0.63">
        <div class="tts-ends"><span>慢</span><span>快</span></div>
      </div>
      <div class="actions center speak-row">
        <button type="button" class="btn secondary" id="speak-btn">🔊 讀生字</button>
        <button type="button" class="btn sun" id="letter-hint-btn">提示一個字母 (−1 HP)</button>
      </div>
      <div class="actions center">
        <button type="button" class="btn" id="check-btn">攻擊！</button>
        <button type="button" class="btn ghost" id="quit-btn">結束冒險</button>
      </div>
    </section>

    <section id="loot" class="screen">
      <div class="loot-card">
        <p class="section-title">打贏啦！獲得裝備</p>
        <div class="loot-art">
          <img src="assets/equipment.png" alt="裝備">
        </div>
        <p class="loot-name" id="loot-name">木劍</p>
        <p class="loot-effect" id="loot-effect">攻擊 +1</p>
        <div class="equip-list" id="equip-list"></div>
        <div class="actions center">
          <button type="button" class="btn" id="loot-continue-btn">繼續前進</button>
        </div>
      </div>
    </section>

    <section id="result" class="screen">
      <img class="result-hero" src="assets/hero.png" alt="勇者">
      <p class="section-title" style="text-align:center;" id="result-title">冒險結束</p>
      <p class="result-score" id="result-score">0 / 20</p>
      <p class="result-message" id="result-message"></p>
      <ul class="result-list" id="result-list"></ul>
      <div class="actions center">
        <button type="button" class="btn" id="again-btn">再挑戰一次</button>
        <button type="button" class="btn ghost" id="home-btn">返回標題</button>
      </div>
    </section>
  </div>

  <script>
    const SPELL_WORDS = [
      'art room : 美術室',
      'first floor : 一樓',
      'draw : 繪畫',

    const Sfx = (() => {
      let ctx = null;

      function ensure() {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        if (!ctx) ctx = new AC();
        if (ctx.state === 'suspended') ctx.resume();
        return ctx;
      }

      function tone(audio, freq, start, dur, type, gain) {
        const osc = audio.createOscillator();
        const amp = audio.createGain();
        const peak = Math.max(gain, 0.001);
        osc.type = type;
        osc.frequency.setValueAtTime(freq, start);
        amp.gain.setValueAtTime(0.0001, start);
        amp.gain.linearRampToValueAtTime(peak, start + Math.min(0.03, dur * 0.35));
        amp.gain.linearRampToValueAtTime(0.0001, start + dur);
        osc.connect(amp);
        amp.connect(audio.destination);
        osc.start(start);
        osc.stop(start + dur + 0.03);
      }

      function schedule(name, audio) {
        const t = audio.currentTime + 0.01;
        if (name === 'tap') {
          tone(audio, 720, t, 0.08, 'triangle', 0.18);
        } else if (name === 'backspace') {
          tone(audio, 300, t, 0.09, 'sine', 0.14);
        } else if (name === 'correct') {
          tone(audio, 523.25, t, 0.14, 'triangle', 0.22);
          tone(audio, 659.25, t + 0.11, 0.16, 'triangle', 0.22);
          tone(audio, 783.99, t + 0.22, 0.24, 'sine', 0.24);
        } else if (name === 'wrong') {
          tone(audio, 220, t, 0.18, 'square', 0.12);
          tone(audio, 165, t + 0.14, 0.22, 'square', 0.1);
        } else if (name === 'warn') {
          tone(audio, 380, t, 0.12, 'triangle', 0.16);
          tone(audio, 300, t + 0.12, 0.14, 'triangle', 0.14);
        } else if (name === 'reveal') {
          tone(audio, 440, t, 0.16, 'sine', 0.18);
          tone(audio, 554.37, t + 0.14, 0.2, 'sine', 0.16);
        } else if (name === 'start') {
          tone(audio, 392, t, 0.12, 'triangle', 0.2);
          tone(audio, 523.25, t + 0.1, 0.14, 'triangle', 0.2);
          tone(audio, 659.25, t + 0.2, 0.2, 'sine', 0.22);
        } else if (name === 'finish') {
          tone(audio, 523.25, t, 0.14, 'triangle', 0.2);
          tone(audio, 659.25, t + 0.12, 0.14, 'triangle', 0.2);
          tone(audio, 783.99, t + 0.24, 0.16, 'triangle', 0.22);
          tone(audio, 1046.5, t + 0.4, 0.3, 'sine', 0.24);
        } else if (name === 'click') {
          tone(audio, 520, t, 0.07, 'sine', 0.16);
        } else if (name === 'hint') {
          tone(audio, 660, t, 0.1, 'triangle', 0.16);
          tone(audio, 880, t + 0.08, 0.12, 'sine', 0.14);
        } else if (name === 'loot') {
          tone(audio, 587.33, t, 0.12, 'triangle', 0.2);
          tone(audio, 783.99, t + 0.12, 0.14, 'triangle', 0.2);
          tone(audio, 987.77, t + 0.24, 0.22, 'sine', 0.22);
        } else if (name === 'gameover') {
          tone(audio, 330, t, 0.2, 'sine', 0.16);
          tone(audio, 247, t + 0.18, 0.28, 'sine', 0.14);
          tone(audio, 196, t + 0.4, 0.35, 'triangle', 0.12);
        }
      }

      function play(name) {
        const audio = ensure();
        if (!audio) return;
        const run = () => {
          try { schedule(name, audio); } catch (err) { console.warn('SFX failed:', err); }
        };
        if (audio.state === 'running') run();
        else audio.resume().then(run).catch(() => {});
      }

      return { play, ensure };
    })();

    function isValidPhrase(phrase) {
      const parts = phrase.trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return false;
      const letterCount = phrase.replace(/[^a-z]/gi, '').length;
      if (letterCount < 2) return false;
      return parts.every((part) => /^[a-z]+(?:'[a-z]+)?$/i.test(part));
    }

    function parseWords(raw) {
      return raw
        .split(/\n+/)
        .map((line) => line.trim())
        .filter(Boolean)
        .map((line) => {
          const colon = line.indexOf(':');
          const phraseRaw = (colon >= 0 ? line.slice(0, colon) : line).trim().replace(/\s+/g, ' ');
          const meaning = colon >= 0 ? line.slice(colon + 1).trim() : '';
          if (!isValidPhrase(phraseRaw)) return null;
          return { word: phraseRaw.toLowerCase(), meaning };
        })
        .filter(Boolean);
    }

    function shuffle(arr) {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function pickBlankIndexes(word) {
      const letters = word.replace(/'/g, '').length;
      const count = Math.max(1, Math.min(letters - 1, Math.ceil(letters * 0.45)));
      const candidates = [];
      for (let i = 0; i < word.length; i += 1) {
        if (/[a-z]/i.test(word[i])) candidates.push(i);
      }
      return new Set(shuffle(candidates).slice(0, count));
    }

    function refillWordDeck() {
      state.wordDeck = shuffle(state.words.slice());
    }

    function pickNextAttackWord() {
      if (!state.words.length) return null;
      if (!state.wordDeck.length) refillWordDeck();
      // Avoid immediately repeating the same word when the deck still has others.
      if (state.wordDeck.length > 1 && state.attackWord) {
        const idx = state.wordDeck.findIndex((w) => w.word !== state.attackWord.word);
        if (idx > 0) {
          const [picked] = state.wordDeck.splice(idx, 1);
          state.attackWord = picked;
          return state.attackWord;
        }
      }
      state.attackWord = state.wordDeck.shift();
      return state.attackWord;
    }

    function renderSlots() {
      const item = currentWord();
      if (!item) return;
      const blankSet = new Set(state.blanks.map((b) => b.index));
      els.slots.innerHTML = '';

      let row = document.createElement('div');
      row.className = 'slot-row';
      els.slots.appendChild(row);

      [...item.word].forEach((ch, i) => {
        if (ch === ' ') {
          row = document.createElement('div');
          row.className = 'slot-row';
          els.slots.appendChild(row);
          return;
        }

        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.dataset.index = String(i);

        if (!/[a-z]/i.test(ch)) {
          slot.textContent = ch;
          slot.classList.add('given');
        } else if (!blankSet.has(i)) {
          slot.textContent = ch.toUpperCase();
          slot.classList.add('given');
        } else {
          const blank = state.blanks.find((b) => b.index === i);
          slot.textContent = blank.value ? blank.value.toUpperCase() : '';
          if (blank.value) slot.classList.add('filled');
          if (state.blanks[state.cursor]?.index === i && !state.locked) {
            slot.classList.add('active');
          }
        }
        row.appendChild(slot);
      });
    }

    function firstEmptyCursor() {
      const idx = state.blanks.findIndex((b) => !b.value);
      return idx === -1 ? Math.max(state.blanks.length - 1, 0) : idx;
    }

    function typeLetter(letter) {
      if (state.locked || !state.blanks.length) return;
      const blank = state.blanks[state.cursor];
      if (!blank) return;
      blank.value = letter.toLowerCase();
      const next = state.blanks.findIndex((b, i) => i > state.cursor && !b.value);
      state.cursor = next === -1 ? firstEmptyCursor() : next;
      els.feedback.textContent = '';
      els.feedback.className = 'feedback';
      Sfx.play('tap');
      renderSlots();
    }

    function backspace() {
      if (state.locked || !state.blanks.length) return;
      const blank = state.blanks[state.cursor];
      if (blank?.value) {
        blank.value = '';
      } else if (state.cursor > 0) {
        state.cursor -= 1;
        state.blanks[state.cursor].value = '';
      }
      els.feedback.textContent = '';
      els.feedback.className = 'feedback';
      Sfx.play('backspace');
      renderSlots();
    }

      els.keyboard.classList.toggle('layout-qwerty', state.keyboardLayout === 'qwerty');

      layout.rows.forEach((letters, rowIndex) => {
        const row = document.createElement('div');
        const isLast = rowIndex === layout.rows.length - 1;
        const cols = letters.length + (isLast ? 1 : 0);
        row.className = `key-row row-${cols}`;

        letters.forEach((letter) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'key';
          btn.textContent = letter;
          btn.addEventListener('click', () => typeLetter(letter));
          row.appendChild(btn);
        });

        if (isLast) {
          const del = document.createElement('button');
          del.type = 'button';
          del.className = 'key wide';
          del.textContent = 'Delete';
          del.addEventListener('click', backspace);
          row.appendChild(del);
        }

        els.keyboard.appendChild(row);
      });

      syncLayoutButton();

    function useLetterHint() {
      if (state.locked || !state.blanks.length || !state.hero) return;
      const item = currentWord();
      if (!item) return;

      let target = state.blanks[state.cursor];
      if (!target || target.value) {
        const emptyIdx = state.blanks.findIndex((b) => !b.value);
        if (emptyIdx === -1) return;
        state.cursor = emptyIdx;
        target = state.blanks[emptyIdx];
      }

      target.value = item.word[target.index].toLowerCase();
      state.usedHint = true;
      const next = state.blanks.findIndex((b, i) => i > state.cursor && !b.value);
      state.cursor = next === -1 ? firstEmptyCursor() : next;

      state.hero.hp = Math.max(0, state.hero.hp - HINT_HP_COST);
      flash(els.heroPanel, 'hit');

      const atkNote = state.hero.hintSafe
        ? '護符生效，攻擊力不變'
        : '今擊攻擊力減半';
      els.feedback.textContent = `已填一個字母（−${HINT_HP_COST} HP · ${atkNote}）`;
      els.feedback.className = 'feedback';
      Sfx.play('hint');
      updateHud();
      renderSlots();

      if (state.hero.hp <= 0) {
        state.locked = true;
        els.checkBtn.disabled = true;
        els.letterHintBtn.disabled = true;
        setTimeout(() => {
          state.answers.push({
            monster: state.monster.name,
            ok: false,
            boss: state.monster.boss,
            reason: '✗ 提示耗盡體力',
            spells: state.monster.spells.slice()
          });
          finishAdventure(false);
        }, 700);
      }
    }

    function speakCurrentWord() {
      const item = currentWord();
      if (!item || !window.speechSynthesis) {
        els.feedback.textContent = '呢個瀏覽器唔支援朗讀。';
        els.feedback.className = 'feedback bad';
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(item.word);
      utterance.lang = 'en-US';
      utterance.rate = state.ttsRate;
      window.speechSynthesis.speak(utterance);
    }

    function preparePuzzle() {
      const item = pickNextAttackWord();
      if (!item) return;
      state.locked = false;
      state.usedHint = false;
      const blankIndexes = pickBlankIndexes(item.word);
      state.blanks = [...blankIndexes]
        .sort((a, b) => a - b)
        .map((index) => ({ index, value: '' }));
      state.cursor = 0;
      els.feedback.textContent = '';
      els.feedback.className = 'feedback';
      els.checkBtn.disabled = false;
      els.speakBtn.disabled = false;
      els.letterHintBtn.disabled = false;
      els.meaning.innerHTML = `${item.meaning || '（無中文提示）'}<small>今次攻擊要串：聽英文，填晒空白格</small>`;
      renderSlots();
      updateHud();
    }

    function guessWord() {
      const item = currentWord();
      const chars = [...item.word];
      state.blanks.forEach((blank) => {
        chars[blank.index] = blank.value || '_';
      });
      return chars.join('');
    }

    function markSlots(ok) {
      state.blanks.forEach((blank) => {
        const slot = els.slots.querySelector(`[data-index="${blank.index}"]`);
        if (!slot) return;
        slot.classList.remove('active', 'filled', 'correct', 'wrong');
        slot.classList.add(ok ? 'correct' : 'wrong');
        slot.textContent = (ok ? currentWord().word[blank.index] : blank.value || '?').toUpperCase();
      });
    }

    function calcAttackDamage() {
      let dmg = state.hero.atk;
      if (state.usedHint && !state.hero.hintSafe) {
        dmg = Math.max(1, Math.floor(dmg / 2));
      }
      if (state.hero.doubleNext) {
        dmg *= 2;
        state.hero.doubleNext = false;
      }
      return dmg;
    }

    function pickLoot() {
      const used = new Set(state.hero.equipment.map((e) => e.id));
      const pool = EQUIPMENT.filter((e) => {
        if (e.kind === 'heal' || e.kind === 'double') return true;
        return !used.has(e.id);
      });
      const source = pool.length ? pool : EQUIPMENT;
      if (isBossEncounter()) {
        const preferred = state.index === MONSTERS.length - 1 ? 'iron_sword' : 'wood_sword';
        const strong = source.find((e) => e.id === preferred)
          || source.find((e) => e.id === 'iron_sword')
          || source[0];
        return { ...strong };
      }
      return { ...source[Math.floor(Math.random() * source.length)] };
    }

    function applyLoot(item) {
      state.hero.equipment.push(item);
      if (item.kind === 'atk') state.hero.atk += item.value;
      if (item.kind === 'def') state.hero.def += item.value;
      if (item.kind === 'heal') {
        state.hero.hp = Math.min(state.hero.maxHp, state.hero.hp + item.value);
      }
      if (item.kind === 'double') state.hero.doubleNext = true;
      if (item.kind === 'hintSafe') state.hero.hintSafe = true;
    }

    function showLoot(item) {
      state.pendingLoot = item;
      applyLoot(item);
      els.lootName.textContent = item.name;
      els.lootEffect.textContent = item.effect;
      els.equipList.innerHTML = state.hero.equipment
        .map((e) => `<span class="equip-chip">${e.name}</span>`)
        .join('');
      Sfx.play('loot');
      showScreen('loot');
      updateHud();
    }

    function finishAdventure(won) {
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      if (state.travelTimer) {
        clearTimeout(state.travelTimer);
        state.travelTimer = null;
      }
      const total = MONSTERS.length;
      els.progressFill.style.width = won ? '100%' : `${(state.index / Math.max(total, 1)) * 100}%`;
      els.resultTitle.textContent = won ? '通關成功！' : '勇者倒下了…';
      els.resultScore.textContent = `${state.wins} / ${total}`;
      if (won) {
        els.resultMessage.textContent = state.wins === total
          ? '完美！二十隻怪物全部打贏啦！'
          : '做得好！繼續練習會更強。';
        Sfx.play('finish');
      } else {
        els.resultMessage.textContent = '下次記得用裝備同提示護符幫手啦！';
        Sfx.play('gameover');
      }

      els.resultList.innerHTML = state.answers.map((a) => {
        const spellBits = (a.spells || [])
          .map((s) => `${s.ok ? '✓' : '✗'} ${s.word}`)
          .join(' · ');
        const detail = a.ok
          ? (a.boss ? '✓ Boss 擊敗' : '✓ 擊敗')
          : (a.reason || '✗ 未擊敗');
        return `<li class="${a.ok ? '' : 'miss'}"><span>${a.monster}${spellBits ? `<br><small style="font-weight:700;color:#4d6b62">${spellBits}</small>` : ''}</span><span>${detail}</span></li>`;
      }).join('');

      showScreen('result');
    }

    function advanceAfterVictory() {
      state.answers.push({
        monster: state.monster.name,
        ok: true,
        boss: state.monster.boss,
        spells: state.monster.spells.slice()
      });
      state.wins += 1;
      const loot = pickLoot();
      showLoot(loot);
    }

    function goToNextEncounter() {
      state.index += 1;
      if (state.index >= MONSTERS.length) {
        finishAdventure(true);
        return;
      }
      beginTravel();
    }

    function beginBattle() {
      state.monster = createMonster();
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      showScreen('battle');
      preparePuzzle();
      if (state.monster.boss) {
        els.feedback.textContent = `${state.monster.name} 出現！串啱先可以打贏佢！`;
        els.feedback.className = 'feedback';
      }
    }

    function beginTravel() {
      const next = currentMonsterDef();
      els.travelCaption.textContent = '勇者向前行…';
      els.travelHint.textContent = next.boss
        ? `前方有強大嘅 Boss：${next.name}！`
        : `前面出現咗「${next.name}」…`;
      els.walker.style.animation = 'none';
      void els.walker.offsetWidth;
      els.walker.style.animation = '';
      showScreen('travel');
      if (state.travelTimer) clearTimeout(state.travelTimer);
      state.travelTimer = setTimeout(() => {
        state.travelTimer = null;
        beginBattle();
      }, 1900);
    }

    function checkAnswer() {
      if (state.locked) return;
      const item = currentWord();
      const incomplete = state.blanks.some((b) => !b.value);
      if (incomplete) {
        els.feedback.textContent = '請填晒所有空白格先攻擊。';
        els.feedback.className = 'feedback bad';
        Sfx.play('warn');
        return;
      }

      const guess = guessWord();
      const ok = guess === item.word;
      state.locked = true;
      els.checkBtn.disabled = true;
      els.letterHintBtn.disabled = true;
      markSlots(ok);

      if (ok) {
        state.monster.spells.push({ word: item.word, meaning: item.meaning, ok: true });
        state.spellLog.push({ word: item.word, meaning: item.meaning, ok: true });
        const dmg = calcAttackDamage();
        state.monster.hp = Math.max(0, state.monster.hp - dmg);
        flash(els.heroPanel, 'attack');
        flash(els.monsterPanel, 'hit');
        els.feedback.textContent = `串啱！造成 ${dmg} 點傷害！`;
        els.feedback.className = 'feedback ok';
        Sfx.play('correct');
        updateHud();

        setTimeout(() => {
          if (state.monster.hp <= 0) {
            advanceAfterVictory();
          } else {
            els.feedback.textContent = '怪物仲未倒下，換個生字再攻擊！';
            els.feedback.className = 'feedback';
            preparePuzzle();
          }
        }, 850);
        return;
      }

      state.monster.spells.push({ word: item.word, meaning: item.meaning, ok: false, guess });
      state.spellLog.push({ word: item.word, meaning: item.meaning, ok: false, guess });
      const damage = Math.max(1, state.monster.atk - state.hero.def);
      state.hero.hp = Math.max(0, state.hero.hp - damage);
      flash(els.monsterPanel, 'attack');
      flash(els.heroPanel, 'hit');
      els.feedback.textContent = `串錯咗！勇者受咗 ${damage} 點傷害。換個生字再試！`;
      els.feedback.className = 'feedback bad';
      Sfx.play('wrong');
      updateHud();

      setTimeout(() => {
        if (state.hero.hp <= 0) {
          state.answers.push({
            monster: state.monster.name,
            ok: false,
            boss: state.monster.boss,
            reason: '✗ 勇者倒下',
            spells: state.monster.spells.slice()
          });
          finishAdventure(false);
          return;
        }
        preparePuzzle();
      }, 900);
    }

    function startAdventure() {
      state.words = parseWords(SPELL_WORDS);
      state.wordDeck = [];
      state.attackWord = null;
      state.index = 0;
      state.wins = 0;
      state.answers = [];
      state.spellLog = [];
      state.blanks = [];
      state.cursor = 0;
      state.locked = false;
      state.usedHint = false;
      state.pendingLoot = null;
      state.hero = createHero();
      state.monster = null;
      buildKeyboard();
      Sfx.play('start');
      beginTravel();
    }

    function goHome() {
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      if (state.travelTimer) {
        clearTimeout(state.travelTimer);
        state.travelTimer = null;
      }
      Sfx.play('click');
      showScreen('title');
    }

    els.titleScene.style.backgroundImage = "url('assets/scene.png')";
    els.travelScene.style.backgroundImage = "url('assets/scene.png')";

    els.startBtn.addEventListener('click', startAdventure);
    els.ttsRate.addEventListener('input', () => {
      state.ttsRate = Number(els.ttsRate.value);
      syncTtsRateLabel();
    });
    syncTtsRateLabel();
    els.speakBtn.addEventListener('click', () => {
      Sfx.ensure();
      speakCurrentWord();
    });
    els.letterHintBtn.addEventListener('click', useLetterHint);
    els.layoutBtn.addEventListener('click', toggleKeyboardLayout);
    els.checkBtn.addEventListener('click', checkAnswer);
    els.quitBtn.addEventListener('click', () => finishAdventure(false));
    els.lootContinueBtn.addEventListener('click', () => {
      Sfx.play('click');
      goToNextEncounter();
    });
    els.againBtn.addEventListener('click', startAdventure);
    els.homeBtn.addEventListener('click', goHome);

    document.addEventListener('keydown', (event) => {
      if (!els.battle.classList.contains('active') || state.locked) return;
      if (/^[a-zA-Z]$/.test(event.key)) {
        event.preventDefault();
        typeLetter(event.key);
      } else if (event.key === 'Backspace') {
        event.preventDefault();
        backspace();
      } else if (event.key === 'Enter') {
        event.preventDefault();
        checkAnswer();
      }
    });

    document.addEventListener('pointerdown', () => Sfx.ensure(), { once: true });
    document.addEventListener('keydown', () => Sfx.ensure(), { once: true });
  </script>
</body>
</html>
